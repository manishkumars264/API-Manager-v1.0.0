<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f6f3">
  <meta name="description" content="API Manager is a local-first workspace for building, sending, organizing, and testing APIs.">
  <title>API Manager — API workspace</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12h14M12 5l7 7-7 7"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 4h12l3 3v13H4V4h1zM8 4v6h8V4M8 20v-6h8v6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 8-4 4 4 4m8-8 4 4-4 4m-3-11-2 14"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></symbol>
    <symbol id="i-zoom-in" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5m-10-13v6m-3-3h6"/></symbol>
    <symbol id="i-zoom-out" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5m-13-10h6"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3m6 0h4"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.7 9a2.4 2.4 0 1 1 4.5 1.2c-.8 1.1-2.2 1.3-2.2 3M12 17h.01"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"/><path d="m19.4 15 .1.1a1.8 1.8 0 0 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .8v.2a1.8 1.8 0 0 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.8l-.1.1a1.8 1.8 0 0 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.8-3h-.2a1.8 1.8 0 0 1 0-3.6h.2a1.8 1.8 0 0 0 .8-3l-.1-.1a1.8 1.8 0 0 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.8v-.2a1.8 1.8 0 0 1 3.6 0v.2a1.8 1.8 0 0 0 3 .8l.1-.1a1.8 1.8 0 0 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .8 3h.2a1.8 1.8 0 0 1 0 3.6h-.2a1.8 1.8 0 0 0-.8 3z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/></symbol>
    <symbol id="i-wrap" viewBox="0 0 24 24"><path d="M3 6h18M3 11h11a3 3 0 0 1 0 6H9m0 0 3-3m-3 3 3 3M3 21h5"/></symbol>
  </svg>

  <div class="app-shell" id="app">
    <header class="topbar">
      <div class="brand-group">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <span class="brand-name">API Manager</span>
        <span class="brand-edition">LOCAL</span>
      </div>
      <button class="workspace-switcher" id="workspace-button" type="button"><span class="workspace-avatar">M</span><span>My Workspace</span><svg class="icon"><use href="#i-chevron-down"/></svg></button>
      <div class="topbar-search-wrap"><svg class="icon"><use href="#i-search"/></svg><input id="global-search" type="search" aria-label="Search" placeholder="Search collections and history"><kbd>⌘ K</kbd></div>
      <div class="topbar-actions">
        <button class="top-action" id="new-request-button" type="button"><svg class="icon"><use href="#i-plus"/></svg><span>New</span></button>
        <button class="top-action" id="import-button" type="button"><svg class="icon"><use href="#i-download"/></svg><span>Import</span></button>
        <button class="icon-button" id="help-button" type="button" title="Help and about"><svg class="icon"><use href="#i-help"/></svg></button>
        <button class="avatar-button" id="about-button" type="button" title="Developer details">M</button>
      </div>
    </header>

    <div class="workspace-layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-workspace"><div class="sidebar-workspace-icon"><svg class="icon"><use href="#i-grid"/></svg></div><div><div class="muted-label">WORKSPACE</div><div class="sidebar-workspace-name">My Workspace</div></div><button class="icon-button small" id="sidebar-more" title="Workspace options" type="button"><svg class="icon"><use href="#i-more"/></svg></button></div>
        <div class="sidebar-section-heading"><span>API WORKSPACE</span><button class="icon-button tiny" id="sidebar-collapse" title="Collapse sidebar" type="button"><svg class="icon"><use href="#i-chevron"/></svg></button></div>
        <nav class="sidebar-nav" aria-label="Workspace navigation">
          <button class="sidebar-nav-item active" data-view="collections" type="button"><svg class="icon"><use href="#i-folder"/></svg><span>Collections</span><span class="nav-count" id="collection-count">0</span></button>
          <button class="sidebar-nav-item" data-view="history" type="button"><svg class="icon"><use href="#i-clock"/></svg><span>History</span><span class="nav-count" id="history-count">0</span></button>
          <button class="sidebar-nav-item" data-view="environments" type="button"><svg class="icon"><use href="#i-globe"/></svg><span>Environments</span></button>
        </nav>
        <div class="sidebar-divider"></div>
        <div class="sidebar-content-heading"><span id="sidebar-content-title">COLLECTIONS</span><button id="sidebar-add-button" class="icon-button tiny" type="button" title="Create collection"><svg class="icon"><use href="#i-plus"/></svg></button></div>
        <div class="sidebar-content" id="sidebar-content"></div>
        <div class="sidebar-bottom"><button type="button" id="console-toggle-side" class="sidebar-bottom-link"><svg class="icon"><use href="#i-terminal"/></svg><span>Console</span><kbd>⌘ ⌥ C</kbd></button><button type="button" id="settings-button" class="sidebar-bottom-link"><svg class="icon"><use href="#i-settings"/></svg><span>Settings</span></button></div>
      </aside>

      <main class="main-area">
        <div class="request-tabs" id="request-tabs" role="tablist" aria-label="Open requests"></div>
        <section class="request-toolbar" aria-label="Request URL">
          <div class="request-target">
            <select id="method-select" class="method-select method-get" aria-label="HTTP method">
              <option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option><option>HEAD</option><option>OPTIONS</option><option>TRACE</option><option>CONNECT</option>
            </select>
            <div class="url-input-wrap"><input id="url-input" type="text" spellcheck="false" placeholder="Enter URL or paste cURL" aria-label="Request URL"><button class="url-clear" id="url-clear" title="Clear URL" type="button" aria-label="Clear URL"><svg class="icon"><use href="#i-x"/></svg></button></div>
            <button class="send-button" id="send-button" type="button"><span id="send-label">Send</span><svg class="icon"><use href="#i-chevron-down"/></svg></button>
          </div>
          <div class="request-toolbar-right"><button class="save-request-button" id="save-request-button" type="button"><svg class="icon"><use href="#i-save"/></svg><span>Save</span></button><button class="icon-button request-more-button" id="request-more-button" title="Request options" type="button"><svg class="icon"><use href="#i-more"/></svg></button></div>
        </section>

        <div class="request-meta"><div class="request-breadcrumb"><span class="crumb-collection" id="breadcrumb-collection">New Request</span><svg class="icon"><use href="#i-chevron"/></svg><span id="breadcrumb-name">Untitled Request</span><span class="unsaved-indicator" id="unsaved-indicator" title="Unsaved changes"></span></div><div class="request-env-select"><span class="env-label">Environment</span><select id="environment-select" aria-label="Active environment"><option value="">No environment</option></select><svg class="icon"><use href="#i-chevron-down"/></svg></div></div>

        <nav class="request-section-tabs" id="request-section-tabs" aria-label="Request configuration">
          <button class="section-tab active" data-section="params" type="button">Params<span class="tab-indicator"></span></button>
          <button class="section-tab" data-section="authorization" type="button">Authorization<span class="tab-indicator"></span></button>
          <button class="section-tab" data-section="headers" type="button">Headers<span class="section-count" id="headers-count"></span><span class="tab-indicator"></span></button>
          <button class="section-tab" data-section="body" type="button">Body<span class="tab-indicator"></span></button>
          <button class="section-tab" data-section="pre" type="button">Pre-request Script<span class="tab-indicator"></span></button>
          <button class="section-tab" data-section="post" type="button">Post-response Script<span class="tab-indicator"></span></button>
          <button class="section-tab" data-section="settings" type="button">Settings<span class="tab-indicator"></span></button>
          <button class="codegen-button" id="codegen-button" type="button"><svg class="icon"><use href="#i-code"/></svg><span>Code</span><svg class="icon"><use href="#i-chevron-down"/></svg></button>
        </nav>
        <section class="request-editor" id="request-editor" aria-live="polite"></section>

        <section class="response-section" id="response-section" aria-label="Response">
          <div class="response-heading">
            <div class="response-heading-left"><span class="response-title">Response</span><span class="response-dot"></span><span id="response-summary" class="response-summary">Send a request to see the response</span></div>
            <div class="response-meta" id="response-meta"></div>
          </div>
          <div class="response-toolbar">
            <div class="response-tabs" id="response-tabs"><button type="button" data-response-tab="body" class="active">Body</button><button type="button" data-response-tab="cookies">Cookies<span class="tab-count" id="cookie-count"></span></button><button type="button" data-response-tab="headers">Headers<span class="tab-count" id="response-header-count"></span></button><button type="button" data-response-tab="tests">Test Results</button></div>
            <div class="response-actions" id="response-actions">
              <div class="response-format"><svg class="icon"><use href="#i-code"/></svg><select id="response-view-mode" aria-label="Response display mode"><option value="pretty">Pretty</option><option value="raw">Raw</option><option value="preview">Preview</option></select><button type="button" id="response-language" class="language-pill">JSON</button></div>
              <span class="toolbar-separator"></span>
              <button class="icon-button response-tool" id="beautify-button" type="button" title="Beautify JSON"><span class="beautify-icon">{ }</span></button>
              <button class="icon-button response-tool" id="wrap-button" type="button" title="Wrap lines"><svg class="icon"><use href="#i-wrap"/></svg></button>
              <button class="icon-button response-tool" id="zoom-out-button" type="button" title="Zoom out"><svg class="icon"><use href="#i-zoom-out"/></svg></button>
              <button class="icon-button response-tool" id="zoom-in-button" type="button" title="Zoom in"><svg class="icon"><use href="#i-zoom-in"/></svg></button>
              <span class="toolbar-separator"></span>
              <button class="icon-button response-tool" id="copy-response-button" type="button" title="Copy response body"><svg class="icon"><use href="#i-copy"/></svg></button>
              <button class="icon-button response-tool" id="copy-all-button" type="button" title="Copy response with headers"><span class="copy-all-symbol">H</span></button>
              <button class="icon-button response-tool" id="download-response-button" type="button" title="Download response as JSON"><svg class="icon"><use href="#i-download"/></svg></button>
            </div>
          </div>
          <div class="response-content" id="response-content"><div class="response-empty"><div class="response-empty-icon"><svg class="icon"><use href="#i-send"/></svg></div><strong>Ready when you are</strong><p>Configure your request, then press <kbd>⌘ Enter</kbd> or select <b>Send</b>.</p></div></div>
        </section>
      </main>
    </div>

    <div class="statusbar"><div class="statusbar-left"><span class="status-led"></span><span>All data saved locally</span><span class="status-divider">·</span><span id="save-status">Ready</span></div><div class="statusbar-right"><span>API Manager <span class="version-tag">v1.0.0</span></span><button type="button" id="status-console-button"><svg class="icon"><use href="#i-terminal"/></svg> Console</button></div></div>
    <section class="console-drawer" id="console-drawer" aria-label="Console" hidden><div class="console-header"><div><svg class="icon"><use href="#i-terminal"/></svg><strong>Console</strong><span id="console-log-count" class="console-count">0</span></div><div><button id="clear-console-button" class="text-button" type="button">Clear</button><button id="close-console-button" class="icon-button small" type="button" title="Close console"><svg class="icon"><use href="#i-x"/></svg></button></div></div><div class="console-log-list" id="console-log-list"></div></section>
  </div>

  <input type="file" id="import-file-input" accept=".json,.txt,.curl,.postman_collection.json,.postman_environment.json,application/json,text/plain" hidden>
  <div id="modal-root"></div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script src="/core.js"></script>
  <script src="/codegen.js"></script>
  <script src="/app.js"></script>
</body>
</html>
